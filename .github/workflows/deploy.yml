name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]        # আপনার default branch অন্য হলে বদলান (যেমন master)
  workflow_dispatch:           # ম্যানুয়ালি চালানোর অপশন

permissions:
  contents: read
  pages: write
  id-token: write

# একাধিক run একসাথে পড়লে বাতিল না করে অপেক্ষা করবে
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # root ডোমেইনে সার্ভ হচ্ছে বলে base-href "/" ঠিক আছে
      - run: flutter build web --release --base-href "/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
